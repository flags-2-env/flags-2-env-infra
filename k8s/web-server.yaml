apiVersion: apps/v1
kind: Deployment
metadata:
  name: flags-2-env-web-server
  namespace: flags-2-env
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flags-2-env-web-server
  template:
    metadata:
      labels:
        app: flags-2-env-web-server
    spec:
      containers:
        - name: web
          image: ghcr.io/flags-2-env/flags-2-env-web-server.rs:main
          ports:
            - containerPort: 8081

